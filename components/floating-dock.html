<div class="floating-dock" aria-label="快速联系">
    <div class="dock-item" data-popover>
        <button class="dock-btn" type="button" aria-label="微信二维码" aria-haspopup="dialog" aria-expanded="false" aria-controls="dock-pop-wechat" title="微信二维码">
            <svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5c0 4.2-4.03 7.5-9 7.5-1.1 0-2.2-.2-3.2-.5L3 20l1.6-3.7A7.7 7.7 0 0 1 3 11.5C3 7.3 6.97 4 12 4s9 3.3 9 7.5z"/>
                <circle cx="9" cy="11" r="1"/>
                <circle cx="15" cy="11" r="1"/>
            </svg>
        </button>
        <div class="dock-popover" id="dock-pop-wechat" role="dialog" aria-label="微信二维码">
            <div class="dock-card">
                <img class="dock-qr" src="/assets/weixin.png" alt="微信二维码">
                <p class="dock-tip">微信扫码，加我联系</p>
            </div>
        </div>
    </div>

    <div class="dock-item" data-popover>
        <button class="dock-btn" type="button" aria-label="QQ 二维码" aria-haspopup="dialog" aria-expanded="false" aria-controls="dock-pop-qqperson" title="QQ 二维码">

                <circle cx="12" cy="6.8" r="3"/>

                <path d="M9 19.4l-1.3 1M15 19.4l1.3 1"/>
            </svg>
        </button>
        <div class="dock-popover" id="dock-pop-qqperson" role="dialog" aria-label="QQ 二维码">
            <div class="dock-card">
                <img class="dock-qr" src="/assets/qq.png" alt="QQ 二维码" onerror="this.style.display='none'">
                <p class="dock-tip">扫码添加 QQ</p>

    <div class="dock-item" data-popover>

                <path d="M3.5 18a5.5 5.5 0 0 1 9-4m8 4a5.5 5.5 0 0 0-9-4"/>

        <div class="dock-popover" id="dock-pop-qq" role="dialog" aria-label="QQ群二维码">
